[package]
name = "pdf_core"
version = "1.15.5"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
lopdf = { version = "0.31.0", features = ["embed_image"] }
image = { version = "0.24.7", default-features = false, features = ["jpeg", "png"] }
flate2 = "1.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pdfcraft-edit = { git = "https://github.com/storytold/pdfcraft.git", rev = "25025fa271d3488c474a292f4b1a9352ab16dedf" }
pdfcraft-cos = { git = "https://github.com/storytold/pdfcraft.git", rev = "25025fa271d3488c474a292f4b1a9352ab16dedf" }
pdfcraft-content = { git = "https://github.com/storytold/pdfcraft.git", rev = "25025fa271d3488c474a292f4b1a9352ab16dedf" }

[patch.crates-io]
hayro-syntax = { git = "https://github.com/storytold/pdfcraft.git", rev = "25025fa271d3488c474a292f4b1a9352ab16dedf" }
hayro-jbig2 = { git = "https://github.com/storytold/pdfcraft.git", rev = "25025fa271d3488c474a292f4b1a9352ab16dedf" }
