name: Build, Package & Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up .NET Core SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Set up Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable

    - name: Package project
      id: package
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $version = (Get-Content VERSION.txt -Raw).Trim()
        if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag $env:GITHUB_REF_NAME does not match VERSION.txt ($version)."
        }
        # Run the existing packaging script
        .\package_project.ps1 -SkipPublish -SkipLocalDeploy
        
        # Return to repository root directory to ensure paths are correct
        Set-Location $env:GITHUB_WORKSPACE
        
        # Parse update-manifest.json to set outputs for release action
        $manifestPath = "releases/update-manifest.json"
        if (Test-Path $manifestPath) {
            $manifest = Get-Content $manifestPath | ConvertFrom-Json
            $manifest.download_url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/$($manifest.file)"
            $manifest | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $manifestPath -Encoding utf8
            .\tools\verify_update_manifest.ps1 -RequireDownloadUrl
            echo "version=$($manifest.version)" >> $env:GITHUB_OUTPUT
            echo "zip_file=$($manifest.file)" >> $env:GITHUB_OUTPUT
            echo "sha256=$($manifest.sha256)" >> $env:GITHUB_OUTPUT
            echo "size=$($manifest.size)" >> $env:GITHUB_OUTPUT
            echo "release_date=$($manifest.release_date)" >> $env:GITHUB_OUTPUT
        } else {
            Write-Error "update-manifest.json not found after packaging!"
            exit 1
        }

    - name: Create GitHub Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          releases/${{ steps.package.outputs.zip_file }}
          releases/update-manifest.json
        name: Release ${{ steps.package.outputs.version }}
        tag_name: ${{ github.ref_name }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Notify WordPress Licensing Server
      shell: pwsh
      env:
        SITE_URL: ${{ secrets.PDFPRO_UPDATE_SITE_URL }}
        TOKEN: ${{ secrets.PDFPRO_PUBLISH_TOKEN }}
      run: |
        $ErrorActionPreference = 'Stop'
        if ([string]::IsNullOrEmpty($env:SITE_URL) -or [string]::IsNullOrEmpty($env:TOKEN)) {
            throw "PDFPRO_UPDATE_SITE_URL and PDFPRO_PUBLISH_TOKEN must be configured to publish an app update."
        }

        # Build download URL pointing to the GitHub Release asset
        $repo = "${{ github.repository }}"
        $tag = "${{ github.ref_name }}"
        $zipFile = "${{ steps.package.outputs.zip_file }}"
        $downloadUrl = "https://github.com/$repo/releases/download/$tag/$zipFile"
        
        $changelog = ""
        $manifestPath = "releases/update-manifest.json"
        if (Test-Path $manifestPath) {
            $manifest = Get-Content $manifestPath | ConvertFrom-Json
            $changelog = $manifest.changelog
        }
        if ([string]::IsNullOrWhiteSpace($changelog)) {
            $changelog = "Tự động phát hành phiên bản mới qua GitHub Actions CI/CD cho tag $tag."
        }
        
        $body = @{
            token = $env:TOKEN
            version = "${{ steps.package.outputs.version }}"
            download_url = $downloadUrl
            sha256 = "${{ steps.package.outputs.sha256 }}"
            size = [int]("${{ steps.package.outputs.size }}")
            release_date = "${{ steps.package.outputs.release_date }}"
            mandatory = [bool]$manifest.mandatory
            changelog = $changelog
        }

        $apiUrl = "$($env:SITE_URL.TrimEnd('/'))/wp-json/pdfpro/v1/update-publish"
        Write-Host "Sending update publish notification to: $apiUrl"
        Write-Host "Download URL will be: $downloadUrl"
        
        $jsonBody = $body | ConvertTo-Json -Depth 4
        $maxRetries = 3
        $success = $false
        
        for ($attempt = 1; $attempt -le $maxRetries; $attempt++) {
            Write-Host "Attempt $attempt of $maxRetries..."
            try {
                $response = Invoke-RestMethod -Uri $apiUrl -Method Post -Body $jsonBody -ContentType "application/json" -TimeoutSec 30 -ErrorAction Stop
                if ($response.success -ne $true) {
                    throw "WordPress did not confirm the update publication."
                }
                Write-Host "WordPress Server Response:"
                $response | ConvertTo-Json | Write-Host
                $success = $true
                break
            } catch {
                Write-Warning "Attempt $attempt failed: $_"
                if ($_.Exception.Response) {
                    try {
                        $reader = New-Object System.IO.StreamReader($_.Exception.Response.GetResponseStream())
                        $responseBody = $reader.ReadToEnd()
                        Write-Warning "Server response body: $responseBody"
                    } catch { }
                }
                if ($attempt -lt $maxRetries) {
                    $delay = $attempt * 10
                    Write-Host "Waiting $delay seconds before retry..."
                    Start-Sleep -Seconds $delay
                }
            }
        }
        
        if (-not $success) {
            throw "The GitHub Release exists, but WordPress update publication failed."
        }

        $checkUrl = "$($env:SITE_URL.TrimEnd('/'))/wp-json/pdfpro/v1/update-check?release_check=$env:GITHUB_RUN_ID"
        $published = Invoke-RestMethod -Uri $checkUrl -Method Get -TimeoutSec 30
        if ($published.success -ne $true -or
            $published.latest_version -ne "${{ steps.package.outputs.version }}" -or
            $published.download_url -ne $downloadUrl -or
            $published.sha256 -ne "${{ steps.package.outputs.sha256 }}" -or
            [int64]$published.file_size -ne [int64]"${{ steps.package.outputs.size }}") {
            throw "The update endpoint does not match the published release."
        }
        .\tools\check_update_endpoint.ps1 -ApiUrl $env:SITE_URL -ExpectedVersion "${{ steps.package.outputs.version }}" -CheckDownload -TimeoutSeconds 120
